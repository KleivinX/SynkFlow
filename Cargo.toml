[package]
name = "synkflow"
version = "0.1.0"
edition = "2024"
description = "Share one mouse, keyboard, clipboard and file sending across your own computers. 100 % local."
license = "GPL-3.0-only"
homepage = "https://blocksandbrew.com/synkflow/"
repository = "https://github.com/KleivinX/SynkFlow"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
bytes = "1.12.1"
cap-std = "4.0.3"
directories = "6.0.0"
fs4 = "1.1.0"
futures-util = { version = "0.3.34", features = ["sink"] }
if-addrs = "0.15.0"
keyring = "4.2.0"
mdns-sd = "0.21.5"
png = "0.18.1"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.3"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
rfd = "0.17.2"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging"] }
tokio-util = { version = "0.7.19", features = ["codec", "rt"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = "1.9.0"

# Slint: the default OpenGL (FemtoVG) renderer where it has been exercised (macOS, Linux); on Windows the CPU
# renderer, which needs no GPU driver and builds much smaller.
[target.'cfg(not(target_os = "windows"))'.dependencies.slint]
version = "1.18.1"
optional = true
features = ["unstable-winit-030"]

[target.'cfg(target_os = "windows")'.dependencies.slint]
version = "1.18.1"
optional = true
default-features = false
features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2", "system-tray", "unstable-winit-030"]

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "linux")'.dependencies.x11rb]
version = "0.14"
features = ["xtest", "xinput", "randr"]

[build-dependencies]
slint-build = { version = "1.18.1", optional = true }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["test-util"] }

[[example]]
name = "ui_snapshots"
required-features = ["gui", "dev-backend"]

[features]
default = ["gui"]
# The Slint desktop UI. Engine, protocol and tests build without it.
gui = ["dep:slint", "dep:slint-build"]
# In-memory input/clipboard backends. For tests and an explicitly labeled
# developer mode only; never enabled in release builds.
dev-backend = []

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["highsierra"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSWorkspace", "NSPasteboardItem", "NSAccessibility"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString"] }

[dev-dependencies.synkflow]
path = "."
default-features = false
features = ["dev-backend"]

# Hashing in unoptimised debug builds would make the large-file tests crawl.
[profile.dev.package.sha2]
opt-level = 3

# The build machine's disk is small: keep line numbers for backtraces but not
# full debug info for dependencies.
[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = 0

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
strip = true
panic = "abort"
